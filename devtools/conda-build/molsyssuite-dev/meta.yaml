# Dependencies derive from the maintained Python 3.14 environment, without clones.
package:
  name: molsyssuite-dev
  version: "{{ environ['MOLSYSSUITE_CONDA_VERSION'] }}"

requirements:
  run:
{% for dependency in development_dependencies %}
    - {{ dependency | tojson }}
{% endfor %}

build:
  noarch: generic
  number: {{ environ['MOLSYSSUITE_CONDA_BUILD_NUMBER'] }}
  string: meta_{{ environ['MOLSYSSUITE_CONDA_BUILD_NUMBER'] }}

test:
  commands:
    - python -c "import sys; assert sys.version_info[:2] == (3, 14)"
    - python -m pytest --version
    - python -m build --version
    - ruff --version

about:
  home: https://github.com/uibcdf/molsyssuite
  license: MIT
  summary: Optional Linux Python 3.14 build and test dependency base
