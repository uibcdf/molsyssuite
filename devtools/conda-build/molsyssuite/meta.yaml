# Render through central_metapackages.py after selecting a reviewed plan.
package:
  name: molsyssuite
  version: "{{ environ['MOLSYSSUITE_CONDA_VERSION'] }}"

requirements:
  run:
    - python >=3.11,<3.15
    - molsysmt
    - molsysviewer
    - smonitor
    - argdigest
    - depdigest
    - pyunitwizard
    - jupyterlab

build:
  noarch: generic
  number: {{ environ['MOLSYSSUITE_CONDA_BUILD_NUMBER'] }}
  string: meta_{{ environ['MOLSYSSUITE_CONDA_BUILD_NUMBER'] }}

test:
  commands:
    - python -c "import molsysmt, molsysviewer, smonitor, argdigest, depdigest, pyunitwizard"
    - jupyter lab --version

about:
  home: https://github.com/uibcdf/molsyssuite
  license: MIT
  summary: Optional curated MolSysSuite public-library dependency bundle
