# Default Linux development environment for the eligible registered cohort.
# Install eligible local clones in editable mode as described in README.md.
# Development integration is not a suite-wide scientific or public support claim.
# The optional standalone Qt host uses the coherent official conda-forge 6.11.2 stack.
name: molsyssuite@uibcdf_3.14
channels:
  - uibcdf
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - pip
  - python-build
  - setuptools
  - wheel
  - setuptools-rust
  - versioningit
  - h5py
  - numpy>=1.26,<3
  - pandas
  - networkx
  - tqdm
  - matplotlib-base
  - py-mmcif>=1.1.1
  - aiohttp
  - anywidget
  - packaging
  - pyyaml
  - traitlets
  - argdigest>=0.13.0
  - depdigest>=0.11.0
  - smonitor>=0.16.0
  - pyunitwizard>=0.26.0
  - pytest
  - pytest-xdist
  - pytest-cov
  - ruff=0.16.5
  - nodejs=24
  - mdtraj
  - mdanalysis
  - openmm
  - biopython
  - rdkit
  - pdbfixer
  - nglview
  - imageio
  - pyside6=6.11.2
  - qt6-webengine=6.11.2
  - qt6-positioning=6.11.2
  - ipykernel
  - jupyterlab
