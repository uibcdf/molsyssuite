name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Stagger this minute against other suite members during admission.
    - cron: "23 5 * * 2"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "__DEV_VERSION__"
      - run: python -m pip install ruff==__RUFF_VERSION__
      - run: ruff check .
      - run: ruff format --check .

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: python=__DEV_VERSION__
      - run: python -m pip install --no-deps --no-build-isolation .
        shell: bash -l {0}
      - run: python -m pytest --receptor=ci
        shell: bash -l {0}

  full_matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [__CI_VERSIONS_YAML__]
    steps:
      - uses: actions/checkout@v6
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: python=${{ matrix.python-version }}
      - run: python -m pip install --no-deps --no-build-isolation .
        shell: bash -l {0}
      - run: python -m pytest --receptor=ci
        shell: bash -l {0}
