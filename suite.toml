schema-version = 2
policy-version = "1.1"

[governance]
repository = "uibcdf/molsyssuite"
platform-governance = "uibcdf/moli"
platform-registry = "moli.toml"
# Platform-contract context for MolSysSuite itself; member policy is local below.
platform-policy-ref = "8056b7861ce9238d75a3b957322d839ccb6c7ca6"
engineering-baseline-owner = "uibcdf/molsyssuite"
reporting-protocol = "devguide/reporting_protocol.md"
bootstrap-issue = "uibcdf/molsyssuite#1"
policy-release = "policy-v1.5.2"
compatible-policy-releases = [
  "policy-v1.5.1",
  "policy-v1.5.0",
  "policy-v1.4.12",
  "policy-v1.4.11",
  "policy-v1.4.10",
  "policy-v1.4.9",
  "policy-v1.4.8",
  "policy-v1.4.6",
  "policy-v1.4.5",
  "policy-v1.4.4",
  "policy-v1.4.3",
  "policy-v1.4.2",
  "policy-v1.4.1",
  "policy-v1.4.0",
  "policy-v1.3.0",
  "policy-v1.2.0",
  "policy-v1.1.6",
]
transition-compatible-policy-releases = ["policy-v1.4.9", "policy-v1.4.8"]
workspace-status = "devtools/scripts/suite_status.py"

[initiatives.stabilization]
status = "active"
issue = "uibcdf/molsyssuite#23"
priority-members = [
  "smonitor",
  "argdigest",
  "depdigest",
  "pyunitwizard",
  "molsysmt",
  "molsysviewer",
]

[policies.member-classification]
status = "accepted"
issue = "uibcdf/molsyssuite#23"
applies-to = ["repository"]
roles = ["scientific-component", "support-library", "developer-tool", "specialist-subsystem"]
memberships = ["primary", "auxiliary"]
maturities = ["incubating", "stabilizing", "stable"]
development-modes = ["active", "maintenance"]
capabilities = ["python-package", "governed-subsystem"]
normative = "devguide/member_classification.md"

[policies.repository-badges]
owner = "uibcdf/molsyssuite"
status = "accepted"
issue = "uibcdf/molsyssuite#23"
applies-to = ["repository"]
adoption = "enforced"
validator = "devtools/scripts/repository_badges.py"
rollout = "devguide/rollouts/repository_badges.md"
normative = "devguide/repository_badges.md"

[policies.python]
owner = "uibcdf/molsyssuite"
status = "accepted"
issue = "uibcdf/molsyssuite#3"
applies-to = ["capability:python-package"]
normative = "devguide/python_policy.md"
requires-python = ">=3.11,<3.14"
development-version = "3.13"
ci-versions = ["3.11", "3.12", "3.13"]

[policies.python.transition]
status = "active"
issue = "uibcdf/molsyssuite#29"
target-requires-python = ">=3.11,<3.15"
target-ci-versions = ["3.11", "3.12", "3.13", "3.14"]

[[policies.python.transition.components]]
name = "pytest-receptor"
issue = "uibcdf/pytest-receptor#3"
state = "admitted"

[[policies.python.transition.components]]
name = "gh-run-receptor"
issue = "uibcdf/gh-run-receptor#49"
state = "admitted"

[[policies.python.transition.components]]
name = "smonitor"
issue = "uibcdf/smonitor#17"
state = "admitted"

[[policies.python.transition.components]]
name = "depdigest"
issue = "uibcdf/depdigest#14"
state = "admitted"

[[policies.python.transition.components]]
name = "argdigest"
issue = "uibcdf/argdigest#13"
state = "admitted"

[[policies.python.transition.components]]
name = "pyunitwizard"
issue = "uibcdf/pyunitwizard#78"
state = "admitted"

[[policies.python.transition.components]]
name = "molsysmt"
issue = "uibcdf/molsysmt#237"
state = "authorized"
compatible-policy-releases = []

[[policies.python.transition.components]]
name = "molsysviewer"
issue = "uibcdf/molsysviewer#93"
state = "authorized"
compatible-policy-releases = []

[policies.python-ci]
owner = "uibcdf/molsyssuite"
status = "accepted"
issue = "uibcdf/molsyssuite#39"
applies-to = ["capability:python-package"]
adoption = "phased"
normative = "devguide/python_ci_policy.md"
review-table = "python-ci-reviews"
routine-python = "3.13"
routine-events = ["push", "pull_request"]
routine-os = "linux"
pull-request-test-level = "full"
skip-ci-recovery = "daily-conditional-full-when-enabled"
full-matrix-frequency = "weekly"
full-matrix-os = ["linux"]
baseline-os = ["linux", "macos"]
optional-os = ["windows"]
claimed-non-linux-frequency = "weekly"
release-installed-matrix = "all-claimed-os-and-python-minors"
manual-dispatch = true

[policies.python-quality]
owner = "uibcdf/molsyssuite"
status = "accepted"
issue = "uibcdf/molsyssuite#4"
applies-to = ["capability:python-package"]
type-checker = "repository-local"
normative = "devguide/python_tooling_policy.md"
formatter = "ruff"
linter = "ruff"
test-runner = "pytest"
ruff-version = "0.16.5"
target-version = "py311"
required-lint-rules = ["E4", "E7", "E9", "F", "I"]

[policies.python-support-libraries]
owner = "uibcdf/molsyssuite"
status = "accepted"
issue = "uibcdf/molsyssuite#6"
applies-to = ["capability:python-package"]
adoption = "phased"
normative = "devguide/python_ecosystem_policy.md"
libraries = ["argdigest", "depdigest", "smonitor", "pyunitwizard"]
review-field = "python_ecosystem_review"

[policies.python-developer-tools]
owner = "uibcdf/molsyssuite"
status = "accepted"
issue = "uibcdf/molsyssuite#6"
applies-to = ["capability:python-package"]
adoption = "phased"
normative = "devguide/python_ecosystem_policy.md"
tools = ["pytest-receptor", "gh-run-receptor"]
review-field = "python_ecosystem_review"

[policies.python-distribution]
owner = "uibcdf/molsyssuite"
status = "accepted"
issue = "uibcdf/molsyssuite#45"
applies-to = ["capability:python-package"]
adoption = "phased"
normative = "devguide/python_distribution_policy.md"
primary-public-channel = "uibcdf"
third-party-channel = "conda-forge"
pypi-route = "optional-verified"
review-field = "python_distribution_review"

[policies.ci-dependency-resolution]
status = "accepted"
issue = "uibcdf/molsyssuite#31"
applies-to = ["capability:python-package"]
scope = "project.dependencies on registered members"
routes = ["conda-environment", "pinned-source"]
validator = "devtools/scripts/check_repository.py"
normative = "devguide/ci_dependency_resolution.md"

[policies.release-version]
owner = "uibcdf/molsyssuite"
status = "accepted"
issue = "uibcdf/molsyssuite#32"
applies-to = ["repository"]
required-policy-release = "policy-v1.4.6"
validator = "devtools/scripts/check_repository.py"
normative = "devguide/release_version_policy.md"
format = "X.Y.Z"
pattern = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
public-prereleases = false

[[policies.release-version.legacy-tags]]
repository = "uibcdf/pyunitwizard"
tags = [
  "0.3.1b",
  "0.3.1b1",
  "0.3.1b2",
  "0.3.2b0",
  "0.3.2b1",
  "0.3.3b0",
  "0.3.3b1",
  "0.4.0.b0",
  "0.4.0.b1",
  "0.5.0b0",
]

[[policies.release-version.legacy-tags]]
repository = "uibcdf/molsysmt"
tags = ["0.5.0b0", "0.5.0b1", "0.5.0b2", "0.6.0b0", "0.6.0b1"]

[policies.reporting-lifecycle]
status = "accepted"
issue = "uibcdf/molsyssuite#11"
applies-to = ["repository"]
pending-kinds = ["bug", "proposal"]
open-statuses = ["open", "active", "blocked", "partial"]
closed-statuses = ["resolved", "withdrawn", "superseded"]
archive-mode = "repository-local"
normative = "devguide/reporting_protocol.md"
rollout-issue = "uibcdf/molsyssuite#13"

[policies.cross-component-feedback]
status = "accepted"
issue = "uibcdf/molsyssuite#15"
applies-to = ["repository"]
provider-report-required = true
consumer-cross-link-required = true
workaround-tracking-required = true
normative = "devguide/cross_component_feedback.md"

[policies.cross-component-issue-labels]
status = "accepted"
issue = "uibcdf/molsyssuite#38"
applies-to = ["repository"]
prefix = "component:"
color = "1d76db"
description-template = "Cross-component relationship with {repository}"
creation = "on-demand"
inventory = "devtools/scripts/component_issue_labels.py"
normative = "devguide/reporting_protocol.md"

[policies.component-guide]
status = "accepted"
issue = "uibcdf/molsyssuite#16"
applies-to = ["repository"]
filename = "MOLSYSSUITE_GUIDE.md"
agents-reference-required = true
copy-mode = "byte-identical"
normative = "MOLSYSSUITE_GUIDE.md"

[policies.component-starter-kit]
status = "accepted"
issue = "uibcdf/molsyssuite#17"
applies-to = ["capability:python-package"]
adoption = "new-repositories"
generator = "devtools/scripts/bootstrap_component.py"
template = "devtools/templates/python_component"
normative = "devguide/new_component_starter_kit.md"

[policies.vendored-guides]
status = "accepted"
issue = "uibcdf/molsyssuite#12"
applies-to = ["capability:python-package"]
format-owner = "canonical-repository"
copy-mode = "byte-identical"
ruff-exclusion = "explicit-root-path"
synchronizer = "devtools/scripts/sync_vendored_guides.py"
marker = "SYNCHRONIZED MOLSYSSUITE GUIDE — DO NOT EDIT COMPONENT COPIES."
normative = "devguide/vendored_guides.md"

[policies.adoption-lifecycle]
status = "accepted"
issue = "uibcdf/molsyssuite#34"
applies-to = ["repository"]
inventory = "devtools/scripts/adoption_status.py"
states = ["current", "compatible", "stale", "missing", "excepted", "unavailable"]
normative = "devguide/adoption_lifecycle.md"

[policies.gh-run-receptor-dogfooding]
status = "accepted"
issue = "uibcdf/molsyssuite#19"
applies-to = ["repository"]
mode = "controlled"
normative = "devguide/gh_run_receptor_policy.md"
rollout = "devguide/rollouts/gh_run_receptor_dogfooding.md"

[policies.zenodo-archival]
