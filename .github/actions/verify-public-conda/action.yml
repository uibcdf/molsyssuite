name: Verify an exact public Conda file
description: Read-only main-label and solver-index verification; no Conda environment needed
inputs:
  owner:
    default: uibcdf
  package:
    required: true
  version:
    required: true
  subdir:
    required: true
  filename:
    required: true
  sha256:
    required: true
outputs:
  evidence-path:
    description: Bounded independent evidence, including failed verification
    value: ${{ steps.verify.outputs.evidence_path }}
runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      env:
        TOOL_ROOT: ${{ github.action_path }}
        OWNER: ${{ inputs.owner }}
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        SUBDIR: ${{ inputs.subdir }}
        FILENAME: ${{ inputs.filename }}
        SHA256: ${{ inputs.sha256 }}
      run: |
        evidence_path="$(mktemp "$RUNNER_TEMP/public-conda-XXXXXXXX.json")"
        echo "evidence_path=$evidence_path" >> "$GITHUB_OUTPUT"
        python "$TOOL_ROOT/../../../devtools/scripts/verify_public_conda.py" \
          --owner "$OWNER" --package "$PACKAGE" --version "$VERSION" \
          --subdir "$SUBDIR" --filename "$FILENAME" --sha256 "$SHA256" \
          --output "$evidence_path"
