name: Vendored guide synchronization

on:
  push:
    paths:
      - "suite.toml"
      - "MOLSYSSUITE_GUIDE.md"
      - "devtools/scripts/check_vendored_guides.py"
      - "devtools/scripts/moli_policy.py"
      - "devtools/scripts/adoption_status.py"
      - "devguide/adoption_lifecycle.md"
      - ".github/workflows/check-vendored-guides.yaml"
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MolSysSuite governance
        uses: actions/checkout@v4
        with:
          path: workspace/molsyssuite
      - name: Check out pinned MOLI governance
        uses: actions/checkout@v4
        with:
          repository: uibcdf/moli
          ref: a92fafbc22423f078ab1a8534bda589b41bc5c64
          path: workspace/moli
          persist-credentials: false
      - name: Check out registered components
        working-directory: workspace
        run: |
          python molsyssuite/devtools/scripts/check_vendored_guides.py \
            --list-repositories | while read -r repository; do
              name="${repository#*/}"
              if [ "$name" != "molsyssuite" ]; then
                git clone --depth=1 "https://github.com/${repository}.git" "$name"
              fi
            done
      - name: Check registered source and consumer copies
        run: >-
          python workspace/molsyssuite/devtools/scripts/check_vendored_guides.py
          workspace
      - name: Report independent guide and policy adoption records
        if: always()
        run: >-
          python workspace/molsyssuite/devtools/scripts/adoption_status.py
          workspace
