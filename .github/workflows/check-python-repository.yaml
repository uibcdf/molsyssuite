name: MolSysSuite policy conformance

on:
  workflow_call:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out member repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up policy Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check out MolSysSuite policy
        uses: actions/checkout@v4
        with:
          repository: uibcdf/molsyssuite
          ref: policy-v1.4.8
          path: .molsyssuite-policy
          persist-credentials: false
      - name: Check out pinned MOLI governance
        uses: actions/checkout@v4
        with:
          repository: uibcdf/moli
          ref: a92fafbc22423f078ab1a8534bda589b41bc5c64
          path: .moli-policy
          persist-credentials: false
      - name: Check repository conformance
        env:
          MOLI_POLICY_ROOT: .moli-policy
        run: >-
          python .molsyssuite-policy/devtools/scripts/check_repository.py .
          --repository "${{ github.repository }}" --skip-guide-content
      - name: Install the policy Ruff version
        run: >-
          python -m pip install --disable-pip-version-check
          "ruff==$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path(".moli-policy/moli.toml").read_text())["policies"]["python_quality"]["ruff_version"])')"
      - name: Check Python lint and imports
        run: ruff check --force-exclude --exclude .molsyssuite-policy --exclude .moli-policy .
      - name: Check Python formatting
        run: ruff format --check --force-exclude --exclude .molsyssuite-policy --exclude .moli-policy .
