name: Validate governance

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install workflow parser dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3" "Jinja2>=3,<4" "packaging>=24" "coverage==7.16.0"
      - name: Validate developer-guide records and registry
        run: python devtools/scripts/validate_governance.py
      - name: Test the governance guard
        run: |
          python -m coverage run --branch --source=devtools/scripts -m unittest discover -s tests -v
          python -m coverage xml -o coverage.xml
      - name: Check the central Conda publisher controls
        run: python devtools/scripts/conda_release_contract.py .
      - name: Retain the measured coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  coverage-upload:
    name: Publish default-branch coverage
    needs: governance
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          path: coverage-report
      - name: Upload the measured report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-report/coverage.xml
          disable_search: true
          fail_ci_if_error: true
